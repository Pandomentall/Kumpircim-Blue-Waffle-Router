<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kumpircim Blue Waffle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-deep: #0a1e3f;
      --blue-mid: #133a7c;
      --blue-light: #2563b8;
      --orange: #ff8a3d;
      --orange-bright: #ffb347;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
      color: #fff;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(255, 138, 61, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(37, 99, 184, 0.35), transparent 55%),
        linear-gradient(160deg, #0a1e3f 0%, #133a7c 55%, #0a1e3f 100%);
      position: relative;
      overflow: hidden;
    }

    /* Yıldız katmanları */
    .stars, .stars2, .stars3 {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars {
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 60px 120px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 130px 80px, #fff, transparent),
        radial-gradient(1px 1px at 200px 200px, #ffd9a8, transparent),
        radial-gradient(1px 1px at 280px 50px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 340px 160px, #fff, transparent),
        radial-gradient(1px 1px at 90px 240px, #fff, transparent),
        radial-gradient(1px 1px at 170px 300px, #ffd9a8, transparent);
      background-repeat: repeat;
      background-size: 400px 400px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .stars2 {
      background-image:
        radial-gradient(1.5px 1.5px at 50px 80px, #fff, transparent),
        radial-gradient(1px 1px at 150px 40px, #ffb347, transparent),
        radial-gradient(2px 2px at 230px 180px, #fff, transparent),
        radial-gradient(1px 1px at 310px 100px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 80px 280px, #fff, transparent),
        radial-gradient(1px 1px at 200px 320px, #ffb347, transparent);
      background-repeat: repeat;
      background-size: 500px 500px;
      animation: twinkle 6s ease-in-out infinite alternate-reverse;
    }

    .stars3 {
      background-image:
        radial-gradient(2px 2px at 100px 150px, #fff, transparent),
        radial-gradient(2.5px 2.5px at 250px 60px, #ffd9a8, transparent),
        radial-gradient(2px 2px at 380px 230px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40px 350px, #fff, transparent);
      background-repeat: repeat;
      background-size: 600px 600px;
      animation: twinkle 8s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%   { opacity: 0.4; }
      50%  { opacity: 1;   }
      100% { opacity: 0.6; }
    }

    /* Kayan yıldız (shooting star) */
    .shooting-star {
      position: absolute;
      top: 18%;
      left: -10%;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), rgba(255,179,71,0.35));
      border-radius: 999px;
      filter: blur(0.4px) drop-shadow(0 0 3px rgba(255,179,71,0.4));
      transform: rotate(18deg);
      animation: shoot 12s ease-out infinite;
      z-index: 1;
      opacity: 0;
      will-change: transform, opacity;
    }

    .shooting-star.delay {
      top: 62%;
      animation-duration: 14s;
      animation-delay: 6s;
    }

    @keyframes shoot {
      0%   { transform: translate(0, 0) rotate(18deg);          opacity: 0; }
      4%   { opacity: 0.7; }
      18%  { transform: translate(60vw, 30vh) rotate(18deg);    opacity: 0.5; }
      28%  { transform: translate(110vw, 55vh) rotate(18deg);   opacity: 0; }
      100% { transform: translate(110vw, 55vh) rotate(18deg);   opacity: 0; }
    }

    /* İçerik */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-wrap {
      width: 180px;
      height: 180px;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(255, 179, 71, 0.25), transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
      animation: float 5s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      background: linear-gradient(90deg, #fff 0%, #ffb347 50%, #fff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      color: #cfd9ea;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      letter-spacing: 0.3px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.1rem 1.4rem;
      border-radius: 16px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
    }

    a.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    a.btn:active { transform: translateY(0); }

    .btn-maps {
      background: linear-gradient(135deg, #ff8a3d 0%, #ffb347 100%);
      color: #2a1500;
      box-shadow: 0 8px 24px rgba(255, 138, 61, 0.35);
    }

    .btn-instagram {
      background: linear-gradient(135deg, #133a7c 0%, #2563b8 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(37, 99, 184, 0.45);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    footer {
      position: relative;
      z-index: 2;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.4px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 1.65rem; }
      .logo-wrap { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star delay"></div>

  <div class="container">
    <div class="logo-wrap">
      <img src="logo.png" alt="Kumpircim Blue Waffle Logo"
           onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:3rem\'>🧇</div>';"/>
    </div>

    <h1>Kumpircim Blue Waffle</h1>
    <p class="tagline">Hoş geldiniz! Ne yapmak istersiniz?</p>

    <div class="buttons">
      <a class="btn btn-maps"
         href="https://maps.app.goo.gl/eUYKEcHcNVwcoZ2N6?g_st=iw"
         target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.401 8.168L12 19.255l-7.335 3.91 1.401-8.168L.132 9.21l8.2-1.192z"/>
        </svg>
        Bizi Puanla (Google Maps)
      </a>

      <a class="btn btn-instagram"
         href="https://www.instagram.com/kumpircimbluewaffle?igsh=MnZxMGd3N3J2Nno2"
         target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.2c3.2 0 3.584.012 4.85.07 1.17.054 1.805.249 2.227.413.56.218.96.478 1.38.898.42.42.68.82.898 1.38.164.422.36 1.057.413 2.227.058 1.266.07 1.65.07 4.85s-.012 3.584-.07 4.85c-.054 1.17-.249 1.805-.413 2.227a3.72 3.72 0 0 1-.898 1.38 3.72 3.72 0 0 1-1.38.898c-.422.164-1.057.36-2.227.413-1.266.058-1.65.07-4.85.07s-3.584-.012-4.85-.07c-1.17-.054-1.805-.249-2.227-.413a3.72 3.72 0 0 1-1.38-.898 3.72 3.72 0 0 1-.898-1.38c-.164-.422-.36-1.057-.413-2.227C2.212 15.584 2.2 15.2 2.2 12s.012-3.584.07-4.85c.054-1.17.249-1.805.413-2.227.218-.56.478-.96.898-1.38.42-.42.82-.68 1.38-.898.422-.164 1.057-.36 2.227-.413C8.416 2.212 8.8 2.2 12 2.2zm0 1.8c-3.146 0-3.5.012-4.737.069-1.005.046-1.55.214-1.913.355-.48.187-.823.41-1.183.77-.36.36-.583.703-.77 1.183-.141.363-.309.908-.355 1.913C3.012 8.5 3 8.854 3 12s.012 3.5.069 4.737c.046 1.005.214 1.55.355 1.913.187.48.41.823.77 1.183.36.36.703.583 1.183.77.363.141.908.309 1.913.355C8.5 20.988 8.854 21 12 21s3.5-.012 4.737-.069c1.005-.046 1.55-.214 1.913-.355.48-.187.823-.41 1.183-.77.36-.36.583-.703.77-1.183.141-.363.309-.908.355-1.913C20.988 15.5 21 15.146 21 12s-.012-3.5-.069-4.737c-.046-1.005-.214-1.55-.355-1.913a3.18 3.18 0 0 0-.77-1.183 3.18 3.18 0 0 0-1.183-.77c-.363-.141-.908-.309-1.913-.355C15.5 3.012 15.146 3 12 3zm0 3.064A5.936 5.936 0 1 1 6.064 12 5.943 5.943 0 0 1 12 6.064zm0 1.8A4.136 4.136 0 1 0 16.136 12 4.14 4.14 0 0 0 12 7.864zm6.16-2.014a1.387 1.387 0 1 1-1.387 1.387 1.387 1.387 0 0 1 1.387-1.387z"/>
        </svg>
        Instagram'da Takip Et
      </a>
    </div>

    <footer>© Kumpircim Blue Waffle</footer>
  </div>

</body>
</html>
